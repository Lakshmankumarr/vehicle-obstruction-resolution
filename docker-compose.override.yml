version: '3.8'

# Development override - runs without Nginx/SSL, uses SQLite
# Usage: docker-compose -f docker-compose.yml -f docker-compose.override.yml up

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - NOTIFICATION_PROVIDER=firebase
      - ALPR_PROVIDER=mock
      - DATABASE_URL=sqlite:///./freeway.db
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  # Disable postgres in development (using SQLite)
  postgres:
    profiles: ["production"]

  redis:
    command: redis-server --appendonly yes

  # Disable nginx and certbot in development
  nginx:
    profiles: ["production"]
  certbot:
    profiles: ["production"]