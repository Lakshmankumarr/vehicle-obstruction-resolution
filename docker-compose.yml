version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: freeway_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freeway_community}
      POSTGRES_USER: ${POSTGRES_USER:-freeway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freeway} -d ${POSTGRES_DB:-freeway_community}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - freeway_network
    restart: unless-stopped

  # Redis Cache & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: freeway_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - freeway_network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freeway_backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-freeway}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-freeway_community}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-freeway-jwt-secret-key-production-ready-32-chars-minimum-token}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=30
      - NOTIFICATION_PROVIDER=${NOTIFICATION_PROVIDER:-mock}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-}
      - ALPR_PROVIDER=${ALPR_PROVIDER:-mock}
      - PLATE_RECOGNIZER_API_KEY=${PLATE_RECOGNIZER_API_KEY:-}
      - OPENALPR_SECRET_KEY=${OPENALPR_SECRET_KEY:-}
      - ALPR_COUNTRY=in
      - MAX_IMAGE_SIZE_MB=10
      - MAX_IMAGE_DIMENSION=1920
      - RATE_LIMIT_HOURLY=30
      - RATE_LIMIT_DAILY=150
      - REQUEST_COOLDOWN_SECONDS=120
      - REQUEST_EXPIRY_MINUTES=30
      - STRIKE_THRESHOLD=3
      - MAX_UNRESOLVED_REQUESTS=5
      - DATA_RETENTION_DAYS=90
      - ALLOWED_ORIGINS=["https://yourdomain.com","http://localhost:3000","http://localhost:8081","http://localhost:19006"]
      - LOG_LEVEL=INFO
      - DEBUG=false
      - API_V1_PREFIX=/api/v1
      - PROJECT_NAME=FreeWay Community API
      - VERSION=1.0.0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - freeway_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: freeway_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - freeway_network
    restart: unless-stopped

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: freeway_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - freeway_network
    profiles:
      - ssl

volumes:
  postgres_data:
  redis_data:

networks:
  freeway_network:
    driver: bridge