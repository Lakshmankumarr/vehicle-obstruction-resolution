name: Android APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-gradle:
    name: Build with Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: FreewayApp/package-lock.json

      - name: Install dependencies
        working-directory: ./FreewayApp
        run: npm ci

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x FreewayApp/android/gradlew

      - name: Build Debug APK
        working-directory: ./FreewayApp/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: freeway-debug-apk
          path: FreewayApp/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-eas:
    name: Build with EAS
    runs-on: ubuntu-latest
    if: false  # Disabled by default - enable if you have EXPO_TOKEN secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: FreewayApp/package-lock.json

      - name: Install Expo CLI and EAS CLI
        run: npm install -g expo-cli eas-cli

      - name: Install dependencies
        working-directory: ./FreewayApp
        run: npm ci

      - name: Install expo-dev-client
        working-directory: ./FreewayApp
        run: npx expo install expo-dev-client

      - name: Build Android APK
        working-directory: ./FreewayApp
        run: eas build --platform android --profile development --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        if: always()
        with:
          name: android-apk
          path: ./apk-output

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freeway-android-apk
          path: ./apk-output/
          retention-days: 30